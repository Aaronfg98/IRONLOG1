/* ---------- datos ---------- */
const getSess=(w,d,create)=>{const id=sid(w,d);if(!S.sessions[id]&&create)S.sessions[id]={week:w,day:d,date:todayISO(),ex:{}};return S.sessions[id]};
const getRec=(w,d,eid,create)=>{const s=getSess(w,d,create);if(!s)return null;if(!s.ex[eid]&&create)s.ex[eid]={sets:[],n:''};return s.ex[eid]||null};
const setsOf=(w,d,eid)=>{const r=getRec(w,d,eid,false);return(r&&r.sets)||[]};
const nS=(w,d,ex)=>(isDeload(w)?2:ex.sets)+((getRec(w,d,ex.id,false)||{}).x||0);
const doneSets=(w,d,eid)=>setsOf(w,d,eid).filter(s=>s&&s.d&&num(s.r)>0);
const doneCount=(w,d,ex)=>setsOf(w,d,ex.id).slice(0,nS(w,d,ex)).filter(s=>s&&s.d&&num(s.r)>0).length;
function topKg(sets){let m=null;sets.forEach(s=>{const k=num(s.k);if(k!=null&&(m==null||k>m))m=k});return m}
function refFor(d,ex,w){for(let x=w-1;x>=1;x--){if(isDeload(x))continue;const f=doneSets(x,d,ex.id);if(f.length)return{week:x,sets:f}}return null}
const TOPS=['pb','se','pi','jn'];
const WUP=['pb','se','pi','pm'];

 'mar|se':'Cuádriceps','mar|pd':'Isquios','mar|pr':'Cuádriceps','mar|pt':'Glúteo','mar|cf':'Isquios','mar|ta':'Gemelos','mar|pl':'Core',
 'jue|fp':'Escápula','jue|fo':'Pecho','jue|pi':'Pecho','jue|ap':'Pecho','jue|rm':'Espalda','jue|el':'Hombro','jue|jp':'Espalda','jue|rp':'Espalda',
 'vie|fp':'Escápula','vie|yt':'Escápula','vie|eo':'Tríceps','vie|pu':'Tríceps','vie|ce':'Bíceps','vie|cp':'Bíceps','vie|ha':'Glúteo','vie|ta':'Gemelos','vie|hl':'Core'};
const MGROUPS=['Pecho','Espalda','Hombro','Escápula','Tríceps','Bíceps','Cuádriceps','Isquios','Glúteo','Gemelos','Core'];
const topWeek=w=>(w>=5&&w<=7)||(w>=9&&w<=11);
const hasTop=(w,ex)=>TOPS.indexOf(ex.id)>=0&&topWeek(w);
const back=(ex,k)=>Math.round(k*.9/ex.step)*ex.step;
function plan(d,ex,w){
  const ref=refFor(d,ex,w);let action=null,sugg=null,note='';
  if(ref){
    const topOnly=hasTop(ref.week,ex);
    const reps=(topOnly?ref.sets.slice(0,1):ref.sets).map(s=>num(s.r));
    action=reps.some(r=>r<ex.min)?'down':reps.every(r=>r>=ex.max)?'up':'keep';
    const rec=getRec(ref.week,d,ex.id,false);
    if(rec&&rec.rir===0){action='down';note='La última serie de la semana '+ref.week+' fue al fallo (RIR 0): baja un escalón.'}
    const top=topOnly?num(ref.sets[0].k):topKg(ref.sets);
    if(!ex.nokg&&top!=null)sugg=isDeload(w)?Math.round(top*.85*2)/2:action==='up'?top+ex.step:action==='down'?Math.max(0,top-ex.step):top;
  }else if(!ex.nokg&&ex.kg!=null){sugg=isDeload(w)?Math.round(ex.kg*.85*2)/2:ex.kg}
  return{ref,action,sugg,note}}
function carryKg(sets,i,sugg){for(let j=i-1;j>=0;j--){const k=num(sets[j]&&sets[j].k);if(k!=null)return k}return sugg}
function phKg(w,ex,sets,i,sugg){
  if(hasTop(w,ex)&&i>=1){
    for(let j=i-1;j>=1;j--){const k=num(sets[j]&&sets[j].k);if(k!=null)return k}
    const b=num(sets[0]&&sets[0].k),base=b!=null?b:sugg;return base!=null?back(ex,base):null}
  return carryKg(sets,i,sugg)}
function gapOf(wk,d,e){const ds=doneSets(wk,d,e.id).filter(s=>s.r2!=null);if(!ds.length)return null;let sum=0;ds.forEach(s=>{sum+=num(s.r2)-num(s.r)});return sum/ds.length}
function gapInfo(d,e,w){const out=[];for(let x=w-1;x>=1&&out.length<2;x--){if(isDeload(x))continue;const g=gapOf(x,d,e);if(g!=null)out.push({week:x,g})}return out}
function wuHtml(d,w){const ss=getSess(w,d.k,false)||{},wu=ss.wu||{};return '<div class="card wu"><h3>Calentamiento del fisio</h3><div class="chips"><button type="button" class="chip l'+(wu.a?' on':'')+'" data-wu="a">Movilidad escapular a 4 patas · 3×12-15</button><button type="button" class="chip l'+(wu.b?' on':'')+'" data-wu="b">Pec deck inversa con goma · 2×12-15</button></div></div>'}
function histBest(d,ex,w){let m=0;for(let x=1;x<w;x++){doneSets(x,d,ex.id).forEach(s=>{m=Math.max(m,e1(num(s.k),num(s.r)))})}return m}
function sessBest(d,ex,w){let m=0;doneSets(w,d,ex.id).forEach(s=>{m=Math.max(m,e1(num(s.k),num(s.r)))});return m}
function isPR(d,ex,w){if(ex.nokg||isDeload(w))return false;const h=histBest(d,ex,w);return h>0&&sessBest(d,ex,w)>h*1.001}
function stats(w,d){const day=dayOf(d);let all=0,done=0,vol=0;
  day.ex.forEach(ex=>{all+=nS(w,d,ex);setsOf(w,d,ex.id).slice(0,nS(w,d,ex)).forEach(s=>{if(s&&s.d&&num(s.r)>0){done++;const k=num(s.k);if(k&&!ex.nokg)vol+=k*num(s.r)}})});
  const ss=getSess(w,d,false);return{all,done,vol,start:ss&&ss.start,end:ss&&ss.end}}

  '<div><span>Récords</span><span>'+(prs.length?esc(prs.join(', ')):'—')+'</span></div></div></div>'}
function exHtml(d,e,w){
  const n=nS(w,d.k,e),dc=doneCount(w,d.k,e),open=S.open===e.id,p=plan(d.k,e,w),unit=e.unit==='s'?'seg':'reps',pr=isPR(d.k,e,w),top=hasTop(w,e);

    if(p.note)h+='<div>'+esc(p.note)+'</div>'}
  else h+='<div>Sin registro anterior en este bloque.</div>';
  if(p.sugg!=null)h+='<div>Hoy: <b>'+fmt(p.sugg)+' kg</b></div>';
  else if(!e.nokg)h+='<div>Peso por calibrar: elige uno con el que acabes a RIR '+rirFor(w)+'.</div>';

    if(gi.length){h+='<div>Derecho − izquierdo en la semana '+gi[0].week+': <b>'+(gi[0].g>0?'+':'')+fmt(Math.round(gi[0].g*10)/10)+' reps</b></div>';
      if(gi.length===2&&gi[0].g>=2&&gi[1].g>=2)h+='<div><span class="tag">BRECHA</span>Dos semanas seguidas con 2 o más reps de diferencia: añade una serie extra solo del izquierdo.</div>'}}
  const wk=num((rec.sets[0]||{}).k)!=null?num(rec.sets[0].k):p.sugg;
  if(WUP.indexOf(e.id)>=0&&wk>0){const r=f=>fmt(Math.round(wk*f/2.5)*2.5);h+='<div>Calentamiento: <b>'+r(.4)+' × 8 · '+r(.6)+' × 5 · '+r(.8)+' × 3</b> kg</div>'}

function chart(pts,o){
  o=o||{};const W=340,H=150,L=36,R=10,T=10,B=22;
  if(!pts.length)return '<p class="muted">Aún no hay datos.</p>';
  const ys=pts.map(p=>p.y).concat(o.goal!=null?[o.goal]:[]);let lo=Math.floor(Math.min.apply(null,ys)*(o.pad||1)-(o.padA||0)),hi=Math.ceil(Math.max.apply(null,ys)+(o.padA||0));if(hi-lo<2)hi=lo+2;
  const step=(hi-lo)/4,X=i=>L+(i-1)*(W-L-R)/(WEEKS-1),Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(o.label||'Gráfica')+'">';
  for(let i=0;i<=4;i++){const v=lo+step*i;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+(Math.round(v*10)/10).toString().replace('.',',')+'</text>'}
  for(let i=1;i<=WEEKS;i++){if(i===1||i%4===0||i===WEEKS)s+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">S'+i+'</text>'}
  if(o.goal!=null)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(o.goal)+'" y2="'+Y(o.goal)+'" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(Y(o.goal)-4)+'" text-anchor="end" style="fill:var(--ok)">Objetivo '+o.goal+' kg</text>';

function bars(vals){
  const W=340,H=130,L=36,R=6,T=8,B=20,max=Math.max.apply(null,vals.map(v=>v.y).concat([1])),bw=(W-L-R)/WEEKS;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Volumen por semana">';
  [0,.5,1].forEach(f=>{const y=T+(1-f)*(H-T-B);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(max*f/1000*10)/10+'k</text>'});
  vals.forEach(v=>{const h=(H-T-B)*v.y/max;s+='<rect x="'+(L+(v.x-1)*bw+3)+'" y="'+(H-B-h)+'" width="'+(bw-6)+'" height="'+h+'" rx="3" fill="var(--accent)"/>'});
  for(let i=1;i<=WEEKS;i++){if(i===1||i%4===0||i===WEEKS)s+='<text x="'+(L+(i-1)*bw+bw/2)+'" y="'+(H-5)+'" text-anchor="middle">S'+i+'</text>'}
  return s+'</svg>'}

function beep(){if(!S.set.sound||!AC)return;try{[0,.28,.56].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=t>.5?1175:880;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.16)})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec){rest={end:Date.now()+sec*1000,total:sec,fired:false};drawRest()}

  el.innerHTML='<div class="rest" id="restbox"><div><div class="lb">Descanso</div><div class="tm" id="rtm">'+mmss((rest.end-Date.now())/1000)+'</div></div><span class="sp"></span><button type="button" data-rest="-15">−15</button><button type="button" data-rest="15">+15</button><button type="button" data-rest="skip">Saltar</button><div class="pg" id="rpg"></div></div>';tickRest()}

  if(left<=0){if(!rest.fired){rest.fired=true;beep();if(box)box.classList.add('end');if(tm)tm.textContent='¡Ya!';setTimeout(()=>{if(rest&&rest.fired){rest=null;drawRest()}},5000)}return}
  if(tm)tm.textContent=mmss(left);if(pg)pg.style.width=Math.round(100*(1-left/rest.total))+'%'}

function toggleSet(eid,i){
  const d=dayOf(S.day),w=S.week,e=d.ex.find(x=>x.id===eid);if(!e)return;
  const s=getSess(w,d.k,true),rec=getRec(w,d.k,eid,true);while(rec.sets.length<=i)rec.sets.push({});
  const set=rec.sets[i],p=plan(d.k,e,w);
  if(set.d){delete set.d;save();render(true);return}
  if(num(set.r)==null){const ps=p.ref&&p.ref.sets[i];if(ps&&num(ps.r)!=null)set.r=num(ps.r);else{const inp=$('#r_'+eid+'_'+i);if(inp)inp.focus();toast('Escribe las repeticiones');return}}
  if(!e.nokg&&num(set.k)==null){const kk=phKg(w,e,rec.sets,i,p.sugg);if(kk!=null)set.k=kk}
  set.d=1;if(!s.start)s.start=Date.now();delete s.end;
  ensureAC();wake();
  if(S.set.rest&&doneCount(w,d.k,e)<nS(w,d.k,e))startRest(REST[eid]||75);
  else if(S.set.rest)startRest(Math.max(REST[eid]||75,90));
  if(doneCount(w,d.k,e)>=nS(w,d.k,e)){const idx=d.ex.findIndex(x=>x.id===eid),order=d.ex.slice(idx+1).concat(d.ex.slice(0,idx)),nx=order.find(x=>doneCount(w,d.k,x)<nS(w,d.k,x));if(nx)S.open=nx.id}

  if(S.open!==eid){const el=$('#ex_'+S.open);if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),50)}}

function summaryText(){
  const L=['IRONLOG · resumen (kg×reps por serie hecha; en unilaterales reps izq/der; T = serie pesada; RIR = última serie)'];
  Object.keys(S.sessions).sort().forEach(id=>{const s=S.sessions[id],d=dayOf(s.day);if(!d)return;const parts=[];
    d.ex.forEach(e=>{const rec=s.ex[e.id],ds=((rec&&rec.sets)||[]).filter(x=>x&&x.d&&num(x.r)>0);if(!ds.length)return;const tp=hasTop(s.week,e);
      parts.push(e.name+': '+ds.map((x,i)=>(tp&&i===0?'T ':'')+(e.nokg?'':fmt(num(x.k))+'×')+fmt(num(x.r))+(e.uni&&x.r2!=null?'/'+fmt(num(x.r2)):'')).join(', ')+(rec.rir!=null?' [RIR '+rec.rir+']':'')+(rec.n?' ['+rec.n+']':''))});
    const wu=s.wu?' · calentamiento '+(s.wu.a?'✓':'✗')+(s.wu.b?'✓':'✗'):'';
    if(parts.length)L.push('S'+s.week+' '+d.n+' ('+s.date+')'+wu+': '+parts.join(' | '))});
  Object.keys(S.body).sort().forEach(id=>{const b=S.body[id];const bits=BODY_FIELDS.filter(f=>b[f[0]]!=null).map(f=>f[1]+' '+fmt(num(b[f[0]])));if(bits.length)L.push('Cuerpo S'+b.week+': '+bits.join(', '))});

function weekCard(){
  const dow=(new Date(S.fday+'T12:00:00').getDay()+6)%7,mon=addDays(S.fday,-dow),vals=[],today=todayISO();
  let sum=0,tsum=0,n=0,budget=0,pastC=0,pastN=0,unl=0,inWeek=false;
  for(let i=0;i<7;i++){const dt=addDays(mon,i),t=dayTotals(dt),g=targets(dt);vals.push({lab:['L','M','X','J','V','S','D'][i],k:t.k,tg:g.k});budget+=g.k;if(dt===today)inWeek=true;
    if(t.k>0){sum+=t.k;tsum+=g.k;n++}
    if(dt<today){pastN++;if(t.k>0)pastC+=t.k;else{pastC+=g.k;unl++}}}
  const W=340,H=130,L=34,R=6,T=8,B=20,max=Math.max.apply(null,vals.map(v=>Math.max(v.k,v.tg)).concat([1000]))*1.08,bw=(W-L-R)/7,Y=v=>T+(1-v/max)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Calorías por día">';
  [0,.5,1].forEach(f=>{const y=Y(max*f);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+r0(max*f)+'</text>'});
  vals.forEach((v,i)=>{const x=L+i*bw,h=(H-T-B)*v.k/max;
    if(v.k>0)s+='<rect x="'+(x+5)+'" y="'+(H-B-h)+'" width="'+(bw-10)+'" height="'+h+'" rx="3" fill="'+(v.k>v.tg*1.05?'var(--warn)':'var(--accent)')+'"/>';
    s+='<line x1="'+(x+2)+'" x2="'+(x+bw-2)+'" y1="'+Y(v.tg)+'" y2="'+Y(v.tg)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="'+(x+bw/2)+'" y="'+(H-5)+'" text-anchor="middle">'+v.lab+'</text>'});
  s+='</svg>';
  let bud='';
  if(inWeek){const left=budget-pastC,days=7-pastN;
    bud='<div class="rows"><div><span>Presupuesto de la semana</span><span>'+r0(budget)+' kcal</span></div><div><span>Días ya pasados'+(unl?' ('+unl+' sin registrar cuentan como objetivo)':'')+'</span><span>'+r0(pastC)+' kcal</span></div><div><span>Te quedan para hoy y '+(days-1)+(days-1===1?' día más':' días más')+'</span><span>'+r0(left)+' kcal</span></div><div><span>Media por día que falta</span><span>≈ '+r0(left/days)+' kcal</span></div></div>'}
  return '<div class="card"><h3>Esta semana</h3>'+s+bud+'<p class="muted">'+(n?'Media de '+n+(n===1?' día':' días')+' registrados: <b>'+r0(sum/n)+' kcal</b> · objetivo medio de esos días '+r0(tsum/n)+' kcal. La raya discontinua es el objetivo de cada día.':'Aún no hay comidas registradas esta semana.')+'</p></div>'}

  if(es0.length){SUG=suggestions({k:G.k-T.k,p:G.p-T.p,c:G.c-T.c,f:G.f-T.f});h+=closeDayCard(T,G)}

/* mantenimiento estimado a partir de peso y comida */
function tdeeCard(){
  const ws=[];for(let i=1;i<=WEEKS;i++){const b=S.body[bid(i)];if(b&&num(b.kg)&&b.date)ws.push({date:b.date,kg:num(b.kg)})}
  ws.sort((a,b)=>a.date<b.date?-1:1);
  const head='<div class="card"><h3>Mantenimiento estimado</h3>';
  if(ws.length<2)return head+'<p class="muted">Se calcula con tus pesajes (pestaña Cuerpo) y lo que registres en Comida. Hacen falta al menos dos pesajes separados por una semana o más.</p></div>';
  const a=ws[Math.max(0,ws.length-3)],b=ws[ws.length-1];
  const n=Math.round((new Date(b.date+'T12:00:00')-new Date(a.date+'T12:00:00'))/864e5);
  let sum=0,logged=0,st=0,stn=0;for(let i=1;i<=n;i++){const dt=addDays(a.date,i),t=dayTotals(dt);if(t.k>0){sum+=t.k;logged++}const sd=(S.food.days[dt]||{}).steps;if(sd){st+=sd;stn++}}
  if(n<5||logged<Math.max(4,Math.ceil(n*.6)))return head+'<p class="muted">Entre el '+a.date+' y el '+b.date+' ('+n+' días) tienes '+logged+' días con comida registrada. Con al menos el 60 % de los días registrados puedo estimarlo.</p></div>';
  const avg=sum/logged,d=b.kg-a.kg,est=avg-d*7700/n;
  return head+'<div class="kc"><div><small>Comías de media</small><b>'+r0(avg)+'</b></div><div><small>Peso</small><b>'+(d>0?'+':'')+fmt(Math.round(d*10)/10)+'</b></div><div><small>Mantenimiento</small><b>'+r0(est)+'</b></div></div><p class="muted">Entre el '+a.date+' y el '+b.date+' ('+n+' días, '+logged+' registrados'+(stn?', media de '+r0(st/stn)+' pasos':'')+'). Es una estimación: el agua mueve el peso uno o dos kilos, así que fíate más cuando haya varias semanas de datos. Si cambias mucho los pasos, el mantenimiento cambia.</p></div>'}

function formHtml(){
  const f=SH.form||{name:'',t:'g',k:'',p:'',c:'',f:''},isNew=!f.id;
  const inp=(id,l,v)=>'<div class="fld"><label for="'+id+'">'+l+'</label><input class="f" id="'+id+'" type="text" inputmode="decimal" autocomplete="off" value="'+esc(v===''||v==null?'':fmt(v))+'"></div>';
  return '<div class="shh"><b>'+(isNew?'Nuevo alimento':'Editar alimento')+'</b><button type="button" class="lnk" data-stab="mine">Atrás</button></div>'+
  '<div class="fld"><label for="n_name">Nombre</label><input class="f sin" id="n_name" type="text" autocomplete="off" value="'+esc(f.name)+'"></div>'+
  '<div class="fld"><label for="n_t">Los valores son</label><select class="sel" id="n_t"><option value="g"'+(f.t==='g'?' selected':'')+'>Por 100 g</option><option value="u"'+(f.t==='u'?' selected':'')+'>Por ración (bocadillo, huevo, plato…)</option></select></div>'+
  '<div class="grid2">'+inp('n_k','Calorías',f.k)+inp('n_p','Proteína (g)',f.p)+inp('n_c','Carbohidratos (g)',f.c)+inp('n_f','Grasa (g)',f.f)+'</div>'+
  '<button type="button" class="fin" data-fform="1">Guardar</button>'+(isNew?'':'<button type="button" class="btn danger" data-fformdel="1">Eliminar</button>')}
function drawSheet(){
  const el=sheetEl();
  if(!SH.open){el.innerHTML='';document.body.style.overflow='';return}
  document.body.style.overflow='hidden';
  let h='<button type="button" class="sh-bg" data-sclose="1" aria-label="Cerrar"></button><div class="sh" role="dialog" aria-label="Añadir alimento">';
  if(SH.food){h+=qtyHtml()}
  else if(SH.tab==='form'){h+=formHtml()}
  else if(SH.tab==='saveblock'){h+='<div class="shh"><b>Guardar como comida</b><button type="button" class="lnk" data-sclose="1">Cerrar</button></div><p class="muted">Se guardan juntas las comidas de '+esc(mealName())+' de este día como una sola ración, para añadirlas de golpe otro día.</p><div class="fld"><label for="sb_name">Nombre</label><input class="f sin" id="sb_name" type="text" autocomplete="off" placeholder="Ej. Desayuno de avena"></div><button type="button" class="fin" data-fsaveok="1">Guardar</button>'}
  else{
    h+='<div class="shh"><b>'+esc(mealName())+'</b><button type="button" class="lnk" data-sclose="1">Cerrar</button></div><div class="tabs">'+[['rec','Recientes'],['mine','Míos'],['paste','Pegar'],['quick','Rápido']].map(t=>'<button type="button" class="tb'+(SH.tab===t[0]?' on':'')+'" data-stab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
    if(SH.tab==='rec'){SH.cur=recents();h+=SH.cur.length?'<div>'+SH.cur.map((f,i)=>foodRow(f,i)).join('')+'</div>':'<p class="muted">Aún no hay alimentos recientes. Usa Míos, Pegar o Rápido.</p>'}
    else if(SH.tab==='mine'){h+='<button type="button" class="btn" data-fnew="1">+ Nuevo alimento</button><input class="f sin" id="mf" type="search" autocomplete="off" placeholder="Filtrar por nombre" aria-label="Filtrar"><div id="mlist">'+mineList('')+'</div>'}
    else if(SH.tab==='paste'){h+='<p class="muted">Pega lo que te dé Claude, una línea por alimento: <b>Nombre; kcal; proteína; carbohidratos; grasa</b>. Si los valores son por 100 g, añade <b>; 100g</b> al final.</p><textarea class="ta" id="pg_ta" placeholder="Bocadillo de lomo; 700; 38; 72; 28" aria-label="Alimentos pegados"></textarea><button type="button" class="fin" data-fpaste="add">Añadir a '+esc(mealName())+'</button><button type="button" class="btn" data-fpaste="lib">Guardar en Míos</button>'}
    else{h+='<div class="fld"><label for="q_n">Nombre (opcional)</label><input class="f sin" id="q_n" type="text" autocomplete="off" placeholder="Ej. Bocadillo del bar"></div><div class="grid2"><div class="fld"><label for="q_k">Calorías</label><input class="f" id="q_k" type="text" inputmode="decimal" autocomplete="off"></div><div class="fld"><label for="q_p">Proteína (g)</label><input class="f" id="q_p" type="text" inputmode="decimal" autocomplete="off"></div><div class="fld"><label for="q_c">Carbohidratos (g)</label><input class="f" id="q_c" type="text" inputmode="decimal" autocomplete="off"></div><div class="fld"><label for="q_f">Grasa (g)</label><input class="f" id="q_f" type="text" inputmode="decimal" autocomplete="off"></div></div><button type="button" class="fin" data-fquick="1">Añadir a '+esc(mealName())+'</button>'}}
  el.innerHTML=h+'</div>';
  if(SH.food)updatePrev()}
function updatePrev(){const el=$('#fprev'),q=num(($('#fq_q')||{}).value);if(!el)return;if(!(q>0)){el.textContent='';return}const m=mac(Object.assign({},SH.food,{q}));el.textContent='= '+r0(m.k)+' kcal · P '+r0(m.p)+' · C '+r0(m.c)+' · G '+r0(m.f)}
function pickFood(f){SH.food=f;SH.edit=null;SH.qv=f.lastQ!=null?f.lastQ:defQ(f);drawSheet()}
function pushEntry(meal,f,q){FD().entries.push({id:uid(),m:meal,name:f.name,brand:f.brand||'',t:f.t,k:f.k,p:f.p,c:f.c,f:f.f,serv:f.serv||null,q,ts:Date.now()})}
function addEntry(){
  const f=SH.food,q=num($('#fq_q').value);if(!(q>0)){toast('Pon una cantidad');return}
  if(SH.edit){const en=FD().entries.find(x=>x.id===SH.edit);if(en)en.q=q}else pushEntry(SH.meal,f,q);
  save();const edited=!!SH.edit;closeSheet();render(true);toast(edited?'Guardado':'Añadido')}
function parsePaste(txt){const out=[];
  String(txt||'').split(/\n+/).forEach(line=>{line=line.trim();if(!line)return;const a=line.split(/[;|\t]/).map(x=>x.trim());if(a.length<2)return;const k=num(a[1]);if(!a[0]||k==null)return;
    out.push({name:a[0],t:/100\s*g/i.test(a[5]||'')?'g':'u',k,p:num(a[2])||0,c:num(a[3])||0,f:num(a[4])||0})});
  return out}
function readForm(){const g=id=>(document.getElementById(id)||{}).value;return{name:String(g('n_name')||'').trim(),t:g('n_t')==='u'?'u':'g',k:num(g('n_k')),p:num(g('n_p'))||0,c:num(g('n_c'))||0,f:num(g('n_f'))||0}}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;const D=t.dataset;
  if(D.fprev){S.fday=addDays(S.fday,-1);render()}
  else if(D.fnext){S.fday=addDays(S.fday,1);render()}
  else if(D.ftoday){S.fday=todayISO();render()}
  else if(D.fgym){const d=FD();d.gym=!isGym(S.fday);save();render(true)}
  else if(D.fcopy){const y=S.food.days[addDays(S.fday,-1)];if(y&&y.entries){y.entries.forEach(e=>FD().entries.push(Object.assign({},e,{id:uid(),ts:Date.now()})));save();render(true);toast('Copiado')}}
  else if(D.fcopym){const y=S.food.days[addDays(S.fday,-1)];if(y&&y.entries){y.entries.filter(e=>e.m===D.fcopym).forEach(e=>FD().entries.push(Object.assign({},e,{id:uid(),ts:Date.now()})));save();render(true);toast('Copiado')}}
  else if(D.ftplsave){const key=isGym(S.fday)?'gym':'rest';S.food.tpl[key]=((S.food.days[S.fday]||{}).entries||[]).map(e=>Object.assign({},e));save();render(true);toast('Menú base guardado')}
  else if(D.ftplapply){const key=isGym(S.fday)?'gym':'rest';(S.food.tpl[key]||[]).forEach(e=>FD().entries.push(Object.assign({},e,{id:uid(),ts:Date.now()})));save();render(true);toast('Menú base aplicado')}
  else if(D.ffav){const a=D.ffav.split('|'),f=S.food.lib.find(x=>x.id===a[1]);if(f){pushEntry(a[0],f,defQ(f));save();render(true);toast('Añadido: '+f.name.slice(0,28))}}
  else if(D.fsug!==undefined){const s=SUG[+D.fsug];if(s){SH.open=true;SH.meal=nextMeal();SH.tab='rec';SH.edit=null;pickFood(Object.assign({},s.f,{lastQ:s.q}))}}
  else if(D.fadd){openSheet(D.fadd)}
  else if(D.fe){const en=((S.food.days[S.fday]||{}).entries||[]).find(x=>x.id===D.fe);if(en){SH.open=true;SH.meal=en.m;SH.edit=en.id;SH.food={name:en.name,brand:en.brand,t:en.t,k:en.k,p:en.p,c:en.c,f:en.f,serv:en.serv,id:'x'};SH.qv=en.q;drawSheet()}}
  else if(D.fsave){SH.open=true;SH.meal=D.fsave;SH.tab='saveblock';SH.food=null;drawSheet()}
  else if(D.fsaveok){const nm=($('#sb_name')||{}).value;if(!nm||!nm.trim()){toast('Ponle un nombre');return}
    const s={k:0,p:0,c:0,f:0};((S.food.days[S.fday]||{}).entries||[]).filter(e=>e.m===SH.meal).forEach(e=>{const m=mac(e);s.k+=m.k;s.p+=m.p;s.c+=m.c;s.f+=m.f});
    S.food.lib.push({id:uid(),name:nm.trim(),t:'u',k:Math.round(s.k),p:Math.round(s.p*10)/10,c:Math.round(s.c*10)/10,f:Math.round(s.f*10)/10});save();closeSheet();toast('Guardado en Míos')}
  else if(D.sclose){closeSheet()}
  else if(D.sback){if(SH.edit)closeSheet();else{SH.food=null;drawSheet()}}
  else if(D.stab){SH.tab=D.stab;SH.food=null;SH.form=null;drawSheet()}
  else if(D.fpick!==undefined){const f=SH.cur[+D.fpick];if(f)pickFood(f)}
  else if(D.fchip){const i=$('#fq_q');if(i){i.value=fmt(+D.fchip);updatePrev()}}
  else if(D.fok){addEntry()}
  else if(D.fdel){const d=FD();d.entries=d.entries.filter(x=>x.id!==SH.edit);save();closeSheet();render(true);toast('Eliminado')}
  else if(D.fsavelib){const f=SH.food;S.food.lib.push({id:uid(),name:f.name,brand:f.brand||'',t:f.t,k:Math.round(f.k*10)/10,p:f.p,c:f.c,f:f.f,serv:f.serv||null});f.id='x';save();toast('Guardado en Míos');drawSheet()}
  else if(D.ffavt){const f=S.food.lib.find(x=>x.id===D.ffavt);if(f){f.fav=!f.fav;save();const q=($('#mf')||{}).value;const m=$('#mlist');if(m)m.innerHTML=mineList(q)}}
  else if(D.fnew){SH.tab='form';SH.form=null;drawSheet()}
  else if(D.fedit){const f=S.food.lib.find(x=>x.id===D.fedit);if(f){SH.tab='form';SH.form=Object.assign({},f);drawSheet()}}
  else if(D.fform){const v=readForm();if(!v.name||v.k==null){toast('Falta el nombre o las calorías');return}
    if(SH.form&&SH.form.id){const i=S.food.lib.findIndex(x=>x.id===SH.form.id);if(i>=0)S.food.lib[i]=Object.assign({},S.food.lib[i],v)}else S.food.lib.push(Object.assign({id:uid()},v));
    save();SH.tab='mine';SH.form=null;drawSheet();toast('Guardado')}
  else if(D.fformdel){if(SH.form&&SH.form.id){S.food.lib=S.food.lib.filter(x=>x.id!==SH.form.id);save();SH.tab='mine';SH.form=null;drawSheet();toast('Eliminado')}}
  else if(D.fpaste){const items=parsePaste(($('#pg_ta')||{}).value);if(!items.length){toast('No he entendido ninguna línea');return}
    if(D.fpaste==='add'){items.forEach(f=>pushEntry(SH.meal,f,f.t==='g'?100:1));save();closeSheet();render(true);toast(items.length+(items.length===1?' alimento añadido':' alimentos añadidos'))}
    else{items.forEach(f=>{const i=S.food.lib.findIndex(x=>x.name===f.name);if(i>=0)S.food.lib[i]=Object.assign({},S.food.lib[i],f);else S.food.lib.push(Object.assign({id:uid()},f))});save();toast(items.length+(items.length===1?' alimento guardado':' alimentos guardados'))}}
  else if(D.fquick){const g=id=>num(($('#'+id)||{}).value),k=g('q_k');if(k==null){toast('Pon las calorías');return}
    pushEntry(SH.meal,{name:(($('#q_n')||{}).value||'').trim()||'Comida rápida',t:'u',k,p:g('q_p')||0,c:g('q_c')||0,f:g('q_f')||0},1);
    save();closeSheet();render(true);toast('Añadido')}});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.tgt){const v=num(t.value);if(v!=null&&v>=0){S.food.tg[t.dataset.tgt]=v;save()}}
  else if(t.id==='fq_q')updatePrev();
  else if(t.id==='mf'){const m=$('#mlist');if(m)m.innerHTML=mineList(t.value)}
  else if(t.id==='steps'){const v=num(t.value),d=FD();if(v==null||v<=0)delete d.steps;else d.steps=v;save()}});

/* ---------- extras de entreno: calentamiento del fisio y RIR ---------- */
document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;const D=t.dataset;
  if(D.wu){const s=getSess(S.week,S.day,true);s.wu=s.wu||{};if(s.wu[D.wu])delete s.wu[D.wu];else s.wu[D.wu]=1;save();render(true)}
  else if(D.rir){const a=D.rir.split('|'),rec=getRec(S.week,S.day,a[0],true),v=+a[1];if(rec.rir===v)delete rec.rir;else rec.rir=v;save();render(true)}});
function muscleCard(){
  const w=S.week,pl={},dn={};MGROUPS.forEach(g=>{pl[g]=0;dn[g]=0});
  DAYS.forEach(d=>d.ex.forEach(e=>{const g=MUSC[d.k+'|'+e.id];if(!g)return;pl[g]+=nS(w,d.k,e);dn[g]+=doneCount(w,d.k,e)}));
  const max=Math.max.apply(null,MGROUPS.map(g=>pl[g]).concat([1]));
  let wu=0,wt=0;['lun','jue','vie'].forEach(k=>{const s=getSess(w,k,false);if(s&&s.start){wt++;if(s.wu&&s.wu.a&&s.wu.b)wu++}});
  return '<div class="card"><h3>Series por músculo · semana '+w+'</h3>'+MGROUPS.map(g=>'<div class="mrow"><div class="mh"><span>'+g+'</span><span><b>'+dn[g]+'</b> / '+pl[g]+' series</span></div><div class="bar" style="width:'+Math.max(8,Math.round(100*pl[g]/max))+'%"><i style="width:'+(pl[g]?Math.round(100*dn[g]/pl[g]):0)+'%"></i></div></div>').join('')+
  '<p class="muted">Series directas del plan de la semana; los fondos cuentan en pecho. Calentamiento del fisio completo en '+wu+' de '+wt+' sesiones de tren superior empezadas esta semana.</p></div>'}

/* ---------- inicio ---------- */
foodInit();render();wake();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
</body>
