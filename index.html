/* Layout: una columna para el móvil. Semanas arriba, cuatro días, tarjetas de ejercicio con tabla de series, cronómetro de descanso flotante y barra inferior. */
:root{
  --bg:#0E1014; --card:#171A20; --card2:#1D2128; --ink:#F1F3F7; --mute:#8E97A6; --line:#262B34; --field:#232831;

  --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,system-ui,sans-serif;
  --font-d:-apple-system-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;

#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

.ckb{height:46px;border-radius:10px;background:var(--field);color:var(--mute);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center}

.mini{display:flex;gap:8px}
.mini button{flex:1;height:40px;border-radius:10px;background:var(--field);font-weight:700;font-size:13px;color:var(--mute)}

.nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);

.d-neg{color:var(--ok)} .d-pos{color:var(--warn)}
svg text{fill:var(--mute);font-family:var(--font);font-size:10px}
.muted{color:var(--mute);font-size:13px;margin:0}
select.sel{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:0 10px}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.tg:first-of-type{border-top:0}
.tg small{display:block;color:var(--mute);font-size:12px}
.sw{width:52px;height:30px;border-radius:99px;background:var(--field);position:relative;flex:0 0 auto}

.btn{height:46px;border-radius:12px;background:var(--field);font-weight:700;font-size:15px;width:100%}

 {k:'jue',n:'Jueves',t:'Upper B',ex:[

 {k:'vie',n:'Viernes',t:'Brazos + escápula',ex:[

];
const BODY_FIELDS=[['kg','Peso (kg)'],['chest','Pecho (cm)'],['armR','Brazo relajado'],['armF','Brazo contraído'],['waist','Cintura'],['hip','Cadera'],['quad','Cuádriceps izq.'],['calf','Gemelo izq.']];

const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const num=v=>{if(v==null||v==='')return null;const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:null};
const fmt=n=>n==null?'':String(Math.round(n*100)/100).replace('.',',');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sid=(w,d)=>'s'+pad(w)+'_'+d, bid=w=>'w'+pad(w);
const isDeload=w=>DELOAD.indexOf(w)>=0;
const rirFor=w=>w<=3?3:w<=7?2:1;
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dayOf=k=>DAYS.find(d=>d.k===k);
const mmss=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+pad(s%60)};
const e1=(k,r)=>(k>0&&r>0)?k*(1+r/30):0;

function curWeek(){const d=Math.floor((Date.now()-START)/864e5);return Math.min(WEEKS,Math.max(1,Math.floor(d/7)+1))}
function defDay(){const g=new Date().getDay();return({1:'lun',2:'mar',3:'jue',4:'jue',5:'vie'})[g]||'lun'}

const LS='ironlog.v2';
const S={week:curWeek(),day:defDay(),tab:'train',open:null,sessions:{},body:{},food:null,fday:'',set:{sound:true,wake:true,rest:true},prog:'lun|pb',confirm:0};
try{const c=JSON.parse(localStorage.getItem(LS)||'null');if(c){S.sessions=c.sessions||{};S.body=c.body||{};S.food=c.food||null;Object.assign(S.set,c.set||{});if(c.ui){S.week=c.ui.week||S.week;S.day=c.ui.day||S.day;S.prog=c.ui.prog||S.prog}}}catch(e){}
let saveFail=false;
function save(){try{localStorage.setItem(LS,JSON.stringify({sessions:S.sessions,body:S.body,food:S.food,set:S.set,ui:{week:S.week,day:S.day,prog:S.prog}}));saveFail=false}catch(e){saveFail=true}}

/* ---------- datos ---------- */
const getSess=(w,d,create)=>{const id=sid(w,d);if(!S.sessions[id]&&create)S.sessions[id]={week:w,day:d,date:todayISO(),ex:{}};return S.sessions[id]};
const getRec=(w,d,eid,create)=>{const s=getSess(w,d,create);if(!s)return null;if(!s.ex[eid]&&create)s.ex[eid]={sets:[],n:''};return s.ex[eid]||null};
const setsOf=(w,d,eid)=>{const r=getRec(w,d,eid,false);return(r&&r.sets)||[]};
const nS=(w,d,ex)=>(isDeload(w)?2:ex.sets)+((getRec(w,d,ex.id,false)||{}).x||0);
const doneSets=(w,d,eid)=>setsOf(w,d,eid).filter(s=>s&&s.d&&num(s.r)>0);
const doneCount=(w,d,ex)=>setsOf(w,d,ex.id).slice(0,nS(w,d,ex)).filter(s=>s&&s.d&&num(s.r)>0).length;
function topKg(sets){let m=null;sets.forEach(s=>{const k=num(s.k);if(k!=null&&(m==null||k>m))m=k});return m}
function refFor(d,ex,w){for(let x=w-1;x>=1;x--){if(isDeload(x))continue;const f=doneSets(x,d,ex.id);if(f.length)return{week:x,sets:f}}return null}
function plan(d,ex,w){
  const ref=refFor(d,ex,w);let action=null,sugg=null;
  if(ref){
    const reps=ref.sets.map(s=>num(s.r));
    action=reps.some(r=>r<ex.min)?'down':reps.every(r=>r>=ex.max)?'up':'keep';
    const top=topKg(ref.sets);
    if(!ex.nokg&&top!=null)sugg=isDeload(w)?Math.round(top*.85*2)/2:action==='up'?top+ex.step:action==='down'?Math.max(0,top-ex.step):top;
  }else if(!ex.nokg&&ex.kg!=null){sugg=isDeload(w)?Math.round(ex.kg*.85*2)/2:ex.kg}
  return{ref,action,sugg}}
function carryKg(sets,i,sugg){for(let j=i-1;j>=0;j--){const k=num(sets[j]&&sets[j].k);if(k!=null)return k}return sugg}
function histBest(d,ex,w){let m=0;for(let x=1;x<w;x++){doneSets(x,d,ex.id).forEach(s=>{m=Math.max(m,e1(num(s.k),num(s.r)))})}return m}
function sessBest(d,ex,w){let m=0;doneSets(w,d,ex.id).forEach(s=>{m=Math.max(m,e1(num(s.k),num(s.r)))});return m}
function isPR(d,ex,w){if(ex.nokg||isDeload(w))return false;const h=histBest(d,ex,w);return h>0&&sessBest(d,ex,w)>h*1.001}
function stats(w,d){const day=dayOf(d);let all=0,done=0,vol=0;
  day.ex.forEach(ex=>{all+=nS(w,d,ex);setsOf(w,d,ex.id).slice(0,nS(w,d,ex)).forEach(s=>{if(s&&s.d&&num(s.r)>0){done++;const k=num(s.k);if(k&&!ex.nokg)vol+=k*num(s.r)}})});
  const ss=getSess(w,d,false);return{all,done,vol,start:ss&&ss.start,end:ss&&ss.end}}

/* ---------- vistas ---------- */
function topHtml(){
  return '<div class="top"><div><div class="logo">IRONLOG</div></div><div class="sub">'+(saveFail?'No se puede guardar en este navegador':'Guardado en este móvil')+'</div></div>'+
  '<div class="weeks" id="weeks">'+Array.from({length:WEEKS},(_,i)=>i+1).map(w=>
    '<button type="button" class="wk'+(w===S.week?' on':'')+(w===curWeek()?' cur':'')+'" data-week="'+w+'">'+w+'<small>'+(isDeload(w)?'DELOAD':'RIR '+rirFor(w))+'</small></button>').join('')+'</div>'}
function bannerHtml(){const w=S.week;return '<div class="banner"><b>Semana '+w+' de '+WEEKS+'</b>'+(isDeload(w)?'<span class="pill dl">Deload</span><span>2 series, −15 % de peso, lejos del fallo</span>':'<span class="pill">RIR '+rirFor(w)+'</span><span>Series fijas. Sube peso cuando todas lleguen al tope de reps.</span>')+'</div>'}
function viewTrain(){
  const d=dayOf(S.day),w=S.week;
  const days=DAYS.map(x=>{const t=stats(w,x.k);return '<button type="button" class="day'+(x.k===S.day?' on':'')+'" data-d="'+x.k+'" data-day="'+x.k+'"><b>'+x.n.slice(0,3)+'</b><span>'+esc(x.t)+'</span><em id="dp_'+x.k+'">'+t.done+'/'+t.all+'</em></button>'}).join('');
  const t=stats(w,S.day);
  if(S.open==null||(S.open!==''&&!d.ex.some(e=>e.id===S.open))){const nx=d.ex.find(e=>doneCount(w,S.day,e)<nS(w,S.day,e));S.open=(nx||d.ex[0]).id}
  const dur=t.start?((t.end||Date.now())-t.start)/1000:0;
  let h=bannerHtml()+'<div class="days">'+days+'</div>'+
  '<h2 class="dh">'+esc(d.n)+' · '+esc(d.t)+'</h2>'+
  '<div class="stats"><div class="stat"><small>Tiempo</small><b id="s_dur">'+(t.start?mmss(dur):'0:00')+'</b></div><div class="stat"><small>Series</small><b id="s_sets">'+t.done+'/'+t.all+'</b></div><div class="stat"><small>Volumen</small><b id="s_vol">'+Math.round(t.vol).toLocaleString('es-ES')+' kg</b></div></div>'+
  '<div class="bar"><i id="dbar" style="width:'+(t.all?Math.round(100*t.done/t.all):0)+'%"></i></div>'+
  '<div class="list">'+d.ex.map(e=>exHtml(d,e,w)).join('')+'</div>';
  if(t.start&&!t.end)h+='<button type="button" class="fin" data-fin="1">Terminar entreno</button>';
  else if(t.end)h+=summaryHtml(d,w,t)+'<button type="button" class="fin alt" data-reopen="1">Reabrir entreno</button>';
  return h}
function summaryHtml(d,w,t){
  const prs=d.ex.filter(e=>isPR(d.k,e,w)).map(e=>e.name);
  return '<div class="sum"><h3>Entreno terminado</h3><div class="rows"><div><span>Duración</span><span>'+mmss((t.end-t.start)/1000)+'</span></div><div><span>Series</span><span>'+t.done+' de '+t.all+'</span></div><div><span>Volumen</span><span>'+Math.round(t.vol).toLocaleString('es-ES')+' kg</span></div>'+
  '<div><span>Récords</span><span>'+(prs.length?esc(prs.join(', ')):'—')+'</span></div></div></div>'}
function exHtml(d,e,w){
  const n=nS(w,d.k,e),dc=doneCount(w,d.k,e),open=S.open===e.id,p=plan(d.k,e,w),unit=e.unit==='s'?'seg':'reps',pr=isPR(d.k,e,w);
  let h='<div class="ex'+(dc>=n?' done':'')+'" id="ex_'+e.id+'"><button type="button" class="exh" data-open="'+e.id+'"><div class="t"><b>'+esc(e.name)+'</b><span>'+n+' × '+e.min+'-'+e.max+(e.unit==='s'?' s':'')+' · '+esc(e.equip)+'</span></div>'+(pr?'<span class="prb">PR</span>':'')+'<span class="cnt" id="cnt_'+e.id+'">'+dc+'/'+n+'</span></button>';
  if(!open)return h+'</div>';
  const rec=getRec(w,d.k,e.id,false)||{sets:[],n:''};
  h+='<div class="exb"><div class="hint">';
  if(e.uni)h+='<div><span class="tag">IZQUIERDO PRIMERO</span>El izquierdo marca el peso y las reps. Apunta las del izquierdo.</div>';
  if(p.ref){const lab={up:'SUBE',keep:'MANTÉN',down:'BAJA'}[p.action];
    h+='<div>Semana '+p.ref.week+': <b>'+(topKg(p.ref.sets)!=null?fmt(topKg(p.ref.sets))+' kg · ':'')+p.ref.sets.map(s=>fmt(num(s.r))).join(', ')+'</b><span class="act '+p.action+'">'+lab+'</span></div>'}
  else h+='<div>Sin registro anterior en este bloque.</div>';
  if(p.sugg!=null)h+='<div>Hoy: <b>'+fmt(p.sugg)+' kg</b></div>';
  else if(!e.nokg)h+='<div>Peso por calibrar: elige uno con el que acabes a RIR '+rirFor(w)+'.</div>';
  if(e.note)h+='<div>'+esc(e.note)+'</div>';
  h+='</div><div class="sets'+(e.nokg?' nokg':'')+'"><span class="lh">Serie</span><span class="lh">Anterior</span>'+(e.nokg?'':'<span class="lh">kg</span>')+'<span class="lh">'+unit+'</span><span class="lh">✓</span>';
  for(let i=0;i<n;i++){
    const s=rec.sets[i]||{};const dn=!!(s.d&&num(s.r)>0);const ps=p.ref&&p.ref.sets[i];
    const prev=ps?(e.nokg?fmt(num(ps.r))+(e.unit==='s'?'s':''):fmt(num(ps.k))+'×'+fmt(num(ps.r))):'—';
    const ph=carryKg(rec.sets,i,p.sugg);
    h+='<div class="row'+(dn?' dn':'')+'" id="row_'+e.id+'_'+i+'"><span class="sn">'+(i+1)+'</span><span class="prev">'+prev+'</span>'+
      (e.nokg?'':'<input class="f" id="k_'+e.id+'_'+i+'" data-ex="'+e.id+'" data-i="'+i+'" data-f="k" type="text" inputmode="decimal" autocomplete="off" placeholder="'+(ph!=null?fmt(ph):'kg')+'" value="'+(s.k!=null?fmt(num(s.k)):'')+'">')+
      '<input class="f" id="r_'+e.id+'_'+i+'" data-ex="'+e.id+'" data-i="'+i+'" data-f="r" type="text" inputmode="numeric" autocomplete="off" placeholder="'+(ps?fmt(num(ps.r)):e.min+'-'+e.max)+'" value="'+(s.r!=null?fmt(num(s.r)):'')+'">'+
      '<button type="button" class="ckb" data-ck="'+e.id+'" data-i="'+i+'" aria-label="Serie '+(i+1)+' hecha">✓</button></div>';
  }
  h+='</div><div class="mini"><button type="button" data-add="'+e.id+'">+ Serie extra</button>'+((rec.x||0)>0?'<button type="button" data-rm="'+e.id+'">− Quitar extra</button>':'')+'</div>';
  h+='<input class="note" data-ex="'+e.id+'" data-f="n" type="text" placeholder="Nota (molestias, sensaciones)" value="'+esc(rec.n||'')+'"></div>';
  return h+'</div>'}

function chart(pts,o){
  o=o||{};const W=340,H=150,L=36,R=10,T=10,B=22;
  if(!pts.length)return '<p class="muted">Aún no hay datos.</p>';
  const ys=pts.map(p=>p.y).concat(o.goal!=null?[o.goal]:[]);let lo=Math.floor(Math.min.apply(null,ys)*(o.pad||1)-(o.padA||0)),hi=Math.ceil(Math.max.apply(null,ys)+(o.padA||0));if(hi-lo<2)hi=lo+2;
  const step=(hi-lo)/4,X=i=>L+(i-1)*(W-L-R)/(WEEKS-1),Y=v=>T+(hi-v)*(H-T-B)/(hi-lo);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+esc(o.label||'Gráfica')+'">';
  for(let i=0;i<=4;i++){const v=lo+step*i;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(Y(v)+3)+'" text-anchor="end">'+(Math.round(v*10)/10).toString().replace('.',',')+'</text>'}
  for(let i=1;i<=WEEKS;i++){if(i===1||i%4===0||i===WEEKS)s+='<text x="'+X(i)+'" y="'+(H-6)+'" text-anchor="middle">S'+i+'</text>'}
  if(o.goal!=null)s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(o.goal)+'" y2="'+Y(o.goal)+'" stroke="var(--ok)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="'+(W-R)+'" y="'+(Y(o.goal)-4)+'" text-anchor="end" style="fill:var(--ok)">Objetivo '+o.goal+' kg</text>';
  if(pts.length>1)s+='<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+pts.map(p=>X(p.x)+','+Y(p.y)).join(' ')+'"/>';
  pts.forEach(p=>{s+='<circle cx="'+X(p.x)+'" cy="'+Y(p.y)+'" r="4" fill="var(--accent)"/>'});
  return s+'</svg>'}
function bars(vals){
  const W=340,H=130,L=36,R=6,T=8,B=20,max=Math.max.apply(null,vals.map(v=>v.y).concat([1])),bw=(W-L-R)/WEEKS;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Volumen por semana">';
  [0,.5,1].forEach(f=>{const y=T+(1-f)*(H-T-B);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(max*f/1000*10)/10+'k</text>'});
  vals.forEach(v=>{const h=(H-T-B)*v.y/max;s+='<rect x="'+(L+(v.x-1)*bw+3)+'" y="'+(H-B-h)+'" width="'+(bw-6)+'" height="'+h+'" rx="3" fill="var(--accent)"/>'});
  for(let i=1;i<=WEEKS;i++){if(i===1||i%4===0||i===WEEKS)s+='<text x="'+(L+(i-1)*bw+bw/2)+'" y="'+(H-5)+'" text-anchor="middle">S'+i+'</text>'}
  return s+'</svg>'}
function viewProg(){
  const opts=[];DAYS.forEach(d=>d.ex.forEach(e=>opts.push({key:d.k+'|'+e.id,d:d,e:e})));
  if(!opts.some(o=>o.key===S.prog))S.prog=opts[0].key;
  const cur=opts.find(o=>o.key===S.prog),d=cur.d,e=cur.e;
  const pts=[],rows=[];
  for(let w=1;w<=WEEKS;w++){const ds=doneSets(w,d.k,e.id);if(!ds.length)continue;
    const best=e.nokg?Math.max.apply(null,ds.map(s=>num(s.r))):Math.max.apply(null,ds.map(s=>e1(num(s.k),num(s.r))));
    pts.push({x:w,y:Math.round(best*10)/10});
    rows.push('<div><span>S'+w+(isDeload(w)?' · deload':'')+'</span><span>'+(e.nokg?ds.map(s=>fmt(num(s.r))).join(', ')+(e.unit==='s'?' s':' reps'):fmt(topKg(ds))+' kg · '+ds.map(s=>fmt(num(s.r))).join(', '))+'</span></div>')}
  const vol=[];for(let w=1;w<=WEEKS;w++){let v=0;DAYS.forEach(dd=>{v+=stats(w,dd.k).vol});vol.push({x:w,y:v})}
  return '<div class="banner"><b>Progreso</b><span>1RM estimado = kg × (1 + reps / 30)</span></div>'+tdeeCard()+
  '<div class="card"><select class="sel" id="progsel" aria-label="Ejercicio">'+opts.map(o=>'<option value="'+o.key+'"'+(o.key===S.prog?' selected':'')+'>'+esc(o.e.name)+' · '+o.d.n.slice(0,3)+'</option>').join('')+'</select>'+
  '<h3>'+(e.nokg?'Mejor serie (reps)':'1RM estimado por semana')+'</h3>'+chart(pts,{label:'Progreso del ejercicio',padA:1})+
  (rows.length?'<div class="rows">'+rows.join('')+'</div>':'')+'</div>'+
  '<div class="card"><h3>Volumen semanal (kg)</h3>'+bars(vol)+'</div>'}
function viewBody(){
  const w=S.week,b=S.body[bid(w)]||{};
  const f=BODY_FIELDS.map(([k,l])=>'<div class="fld"><label for="b_'+k+'">'+l+'</label><input class="f" id="b_'+k+'" data-b="'+k+'" type="text" inputmode="decimal" autocomplete="off" value="'+(b[k]!=null?fmt(num(b[k])):'')+'"></div>').join('');
  const pts=[];for(let i=1;i<=WEEKS;i++){const x=S.body[bid(i)];const v=x&&num(x.kg);if(v)pts.push({x:i,y:v})}
  let rows='';pts.forEach((p,i)=>{const dl=i?p.y-pts[i-1].y:null;rows+='<div><span>Semana '+p.x+'</span><span>'+fmt(p.y)+' kg'+(dl!=null?' <small class="'+(dl<=0?'d-neg':'d-pos')+'">'+(dl>0?'+':'')+fmt(dl)+'</small>':'')+'</span></div>'});
  return '<div class="banner"><b>Semana '+w+' de '+WEEKS+'</b><span>Pésate el viernes en ayunas. Medidas cada 4 semanas (S1, S5, S9).</span></div>'+
  '<div class="card"><h3>Peso y medidas · semana '+w+'</h3><div class="grid2">'+f+'</div></div>'+
  '<div class="card"><h3>Evolución del peso</h3>'+chart(pts,{goal:GOAL_KG,label:'Peso por semana',padA:.5})+(rows?'<div class="rows">'+rows+'</div>':'<p class="muted">Referencia anterior: 80,7 kg el 17 de octubre.</p>')+'</div>'}
function tg(id,title,sub,on){return '<div class="tg"><div>'+title+'<small>'+sub+'</small></div><button type="button" class="sw'+(on?' on':'')+'" data-tg="'+id+'" aria-label="'+title+'" aria-pressed="'+on+'"></button></div>'}
function viewSet(){
  return '<div class="banner"><b>Ajustes</b></div>'+
  '<div class="card"><h3>Durante el entreno</h3>'+tg('rest','Descanso automático','Arranca el cronómetro al marcar una serie',S.set.rest)+tg('sound','Sonido al terminar','Pitidos cuando acaba el descanso',S.set.sound)+tg('wake','Mantener pantalla encendida','Evita que el móvil se bloquee',S.set.wake)+'</div>'+

function updateLive(){
  if(S.tab!=='train')return;

  d.ex.forEach(e=>{const n=nS(w,d.k,e),c=doneCount(w,d.k,e),el=$('#cnt_'+e.id);if(el)el.textContent=c+'/'+n;const card=$('#ex_'+e.id);if(card)card.classList.toggle('done',c>=n)});
  DAYS.forEach(x=>{const t=stats(w,x.k),el=$('#dp_'+x.k);if(el)el.textContent=t.done+'/'+t.all});

  const a=$('#s_sets');if(a)a.textContent=t.done+'/'+t.all;const v=$('#s_vol');if(v)v.textContent=Math.round(t.vol).toLocaleString('es-ES')+' kg';

let rest=null,AC=null,wl=null;
function ensureAC(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}}
function beep(){if(!S.set.sound||!AC)return;try{[0,.28,.56].forEach(t=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=t>.5?1175:880;g.gain.value=.2;o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+.16)})}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}}
function startRest(sec){rest={end:Date.now()+sec*1000,total:sec,fired:false};drawRest()}
function drawRest(){
  const el=$('#restbar');document.body.classList.toggle('hasrest',!!rest);if(!rest){el.innerHTML='';return}
  el.innerHTML='<div class="rest" id="restbox"><div><div class="lb">Descanso</div><div class="tm" id="rtm">'+mmss((rest.end-Date.now())/1000)+'</div></div><span class="sp"></span><button type="button" data-rest="-15">−15</button><button type="button" data-rest="15">+15</button><button type="button" data-rest="skip">Saltar</button><div class="pg" id="rpg"></div></div>';tickRest()}
function tickRest(){
  if(!rest)return;const left=(rest.end-Date.now())/1000;
  const tm=$('#rtm'),pg=$('#rpg'),box=$('#restbox');
  if(left<=0){if(!rest.fired){rest.fired=true;beep();if(box)box.classList.add('end');if(tm)tm.textContent='¡Ya!';setTimeout(()=>{if(rest&&rest.fired){rest=null;drawRest()}},5000)}return}
  if(tm)tm.textContent=mmss(left);if(pg)pg.style.width=Math.round(100*(1-left/rest.total))+'%'}
setInterval(()=>{tickRest();updateLive()},500);
async function wake(){try{if(S.set.wake&&'wakeLock' in navigator&&document.visibilityState==='visible'&&!wl){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}}catch(e){wl=null}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){wake();tickRest()}});

/* ---------- acciones ---------- */
function toggleSet(eid,i){
  const d=dayOf(S.day),w=S.week,e=d.ex.find(x=>x.id===eid);if(!e)return;
  const s=getSess(w,d.k,true),rec=getRec(w,d.k,eid,true);while(rec.sets.length<=i)rec.sets.push({});
  const set=rec.sets[i],p=plan(d.k,e,w);
  if(set.d){delete set.d;save();render(true);return}
  if(num(set.r)==null){const ps=p.ref&&p.ref.sets[i];if(ps&&num(ps.r)!=null)set.r=num(ps.r);else{const inp=$('#r_'+eid+'_'+i);if(inp)inp.focus();toast('Escribe las repeticiones');return}}
  if(!e.nokg&&num(set.k)==null){const kk=carryKg(rec.sets,i,p.sugg);if(kk!=null)set.k=kk}
  set.d=1;if(!s.start)s.start=Date.now();delete s.end;
  ensureAC();wake();
  if(S.set.rest&&doneCount(w,d.k,e)<nS(w,d.k,e))startRest(REST[eid]||75);
  else if(S.set.rest)startRest(Math.max(REST[eid]||75,90));
  if(doneCount(w,d.k,e)>=nS(w,d.k,e)){const idx=d.ex.findIndex(x=>x.id===eid),order=d.ex.slice(idx+1).concat(d.ex.slice(0,idx)),nx=order.find(x=>doneCount(w,d.k,x)<nS(w,d.k,x));if(nx)S.open=nx.id}
  save();render(true);drawRest();
  if(S.open!==eid){const el=$('#ex_'+S.open);if(el)setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),50)}}
function backupObj(){return{app:'ironlog',v:2,exported:new Date().toISOString(),sessions:S.sessions,body:S.body,food:S.food}}
function summaryText(){
  const L=['IRONLOG · resumen (kg×reps por serie hecha; * = serie extra)'];
  Object.keys(S.sessions).sort().forEach(id=>{const s=S.sessions[id],d=dayOf(s.day);if(!d)return;const parts=[];
    d.ex.forEach(e=>{const ds=(s.ex[e.id]&&s.ex[e.id].sets||[]).filter(x=>x&&x.d&&num(x.r)>0);if(!ds.length)return;
      parts.push(e.name+': '+ds.map(x=>(e.nokg?'':fmt(num(x.k))+'×')+fmt(num(x.r))).join(', ')+(s.ex[e.id].n?' ['+s.ex[e.id].n+']':''))});
    if(parts.length)L.push('S'+s.week+' '+d.n+' ('+s.date+'): '+parts.join(' | '))});
  Object.keys(S.body).sort().forEach(id=>{const b=S.body[id];const bits=BODY_FIELDS.filter(f=>b[f[0]]!=null).map(f=>f[1]+' '+fmt(num(b[f[0]])));if(bits.length)L.push('Cuerpo S'+b.week+': '+bits.join(', '))});
  Object.keys(S.food.days).sort().slice(-21).forEach(d=>{const es=S.food.days[d].entries||[];if(!es.length)return;const t=dayTotals(d),g=targets(d);L.push('Comida '+d+' ('+(isGym(d)?'gym':'descanso')+'): '+r0(t.k)+' kcal de '+r0(g.k)+' · P '+r0(t.p)+' · C '+r0(t.c)+' · G '+r0(t.f)+' — '+es.map(e=>e.name+' '+qtyText(e)).join('; '))});
  return L.join('\n')}
async function copyText(t,okMsg){
  try{await navigator.clipboard.writeText(t);toast(okMsg);return}catch(e){}
  const ta=$('#impta');if(ta){ta.value=t;ta.focus();ta.select();toast('Selecciona y copia el texto')}}
async function doExport(){
  const txt=JSON.stringify(backupObj());const name='ironlog-'+todayISO()+'.json';
  try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:'Copia IRONLOG'});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Copia guardada')}catch(e){copyText(txt,'Copia copiada como texto')}}
function doImport(txt){
  try{const o=JSON.parse(txt);if(!o||o.app!=='ironlog'||!o.sessions)throw new Error('formato');
    S.sessions=o.sessions||{};S.body=o.body||{};S.food=o.food||null;foodInit();save();render();toast('Datos restaurados')}catch(e){toast('No es una copia válida de IRONLOG')}}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;

  else if(t.dataset.rm){const r=getRec(S.week,S.day,t.dataset.rm,true);r.x=Math.max(0,(r.x||0)-1);save();render(true)}
  else if(t.dataset.fin){const s=getSess(S.week,S.day,true);s.end=Date.now();save();render();window.scrollTo(0,document.body.scrollHeight)}
  else if(t.dataset.reopen){const s=getSess(S.week,S.day,true);delete s.end;save();render(true)}
  else if(t.dataset.rest){if(!rest)return;if(t.dataset.rest==='skip'){rest=null;drawRest()}else{rest.end+=+t.dataset.rest*1000;rest.total=Math.max(rest.total,(rest.end-Date.now())/1000);rest.fired=false;const b=$('#restbox');if(b)b.classList.remove('end');tickRest()}}
  else if(t.dataset.tg){S.set[t.dataset.tg]=!S.set[t.dataset.tg];if(t.dataset.tg==='wake'){if(S.set.wake)wake();else if(wl){wl.release();wl=null}}if(t.dataset.tg==='sound'&&S.set.sound){ensureAC();beep()}save();render(true)}
  else if(t.dataset.act==='export')doExport();
  else if(t.dataset.act==='copyjson')copyText(JSON.stringify(backupObj()),'Copia copiada');
  else if(t.dataset.act==='summary')copyText(summaryText(),'Resumen copiado');
  else if(t.dataset.act==='import'){const v=$('#impta').value.trim();if(v)doImport(v);else toast('Pega primero la copia')}
  else if(t.dataset.act==='askwipe'){S.confirm=1;render(true)}
  else if(t.dataset.act==='nowipe'){S.confirm=0;render(true)}
  else if(t.dataset.act==='wipe'){S.sessions={};S.body={};S.food=null;foodInit();S.confirm=0;save();render();toast('Datos borrados')}
  else if(t.id&&t.id.indexOf('t-')===0){S.tab=t.id.slice(2);render();window.scrollTo(0,0)}});

  }else{if(v==null){delete set.r;delete set.d;const row=$('#row_'+e.id+'_'+i);if(row)row.classList.remove('dn')}else set.r=v}

const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const dayLabel=iso=>{const d=new Date(iso+'T12:00:00');return(iso===todayISO()?'Hoy · ':'')+['dom','lun','mar','mié','jue','vie','sáb'][d.getDay()]+' '+d.getDate()+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]};
function foodInit(){
  if(!S.food||typeof S.food!=='object')S.food={};
  S.food.days=S.food.days||{};
  S.food.tg=Object.assign({gym:2200,rest:1900,p:128,fg:65,fr:70},S.food.tg||{});
  if(!Array.isArray(S.food.lib))S.food.lib=SEED.map(f=>Object.assign({id:uid()},f));

const FD=()=>S.food.days[S.fday]||(S.food.days[S.fday]={entries:[]});
const mac=en=>{const m=en.t==='g'?en.q/100:en.q;return{k:en.k*m,p:en.p*m,c:en.c*m,f:en.f*m}};
const qtyText=en=>en.t==='g'?fmt(en.q)+' g':'× '+fmt(en.q);
function dayTotals(date){const d=S.food.days[date],t={k:0,p:0,c:0,f:0};((d&&d.entries)||[]).forEach(en=>{const m=mac(en);t.k+=m.k;t.p+=m.p;t.c+=m.c;t.f+=m.f});return t}
function isGym(date){const d=S.food.days[date];if(d&&d.gym!=null)return d.gym;return[1,2,4,5].indexOf(new Date(date+'T12:00:00').getDay())>=0}
function targets(date){const T=S.food.tg,g=isGym(date),k=g?T.gym:T.rest,f=g?T.fg:T.fr,p=T.p;return{k,p,f,c:Math.max(0,(k-p*4-f*9)/4)}}
function mrow(label,val,tg,unit){const pct=tg>0?Math.min(100,100*val/tg):0;return '<div class="mrow"><div class="mh"><span>'+label+'</span><span><b>'+r0(val)+'</b> / '+r0(tg)+' '+unit+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>'}
function weekCard(){
  const dow=(new Date(S.fday+'T12:00:00').getDay()+6)%7,mon=addDays(S.fday,-dow),vals=[];let sum=0,tsum=0,n=0;
  for(let i=0;i<7;i++){const dt=addDays(mon,i),t=dayTotals(dt),g=targets(dt);vals.push({lab:['L','M','X','J','V','S','D'][i],k:t.k,tg:g.k});if(t.k>0){sum+=t.k;tsum+=g.k;n++}}
  const W=340,H=130,L=34,R=6,T=8,B=20,max=Math.max.apply(null,vals.map(v=>Math.max(v.k,v.tg)).concat([1000]))*1.08,bw=(W-L-R)/7,Y=v=>T+(1-v/max)*(H-T-B);
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Calorías por día">';
  [0,.5,1].forEach(f=>{const y=Y(max*f);s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-6)+'" y="'+(y+3)+'" text-anchor="end">'+r0(max*f)+'</text>'});
  vals.forEach((v,i)=>{const x=L+i*bw,h=(H-T-B)*v.k/max;
    if(v.k>0)s+='<rect x="'+(x+5)+'" y="'+(H-B-h)+'" width="'+(bw-10)+'" height="'+h+'" rx="3" fill="'+(v.k>v.tg*1.05?'var(--warn)':'var(--accent)')+'"/>';
    s+='<line x1="'+(x+2)+'" x2="'+(x+bw-2)+'" y1="'+Y(v.tg)+'" y2="'+Y(v.tg)+'" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3"/><text x="'+(x+bw/2)+'" y="'+(H-5)+'" text-anchor="middle">'+v.lab+'</text>'});
  s+='</svg>';
  return '<div class="card"><h3>Esta semana</h3>'+s+'<p class="muted">'+(n?'Media de '+n+(n===1?' día':' días')+' registrados: <b>'+r0(sum/n)+' kcal</b> · objetivo medio de esos días '+r0(tsum/n)+' kcal. La raya discontinua es el objetivo de cada día.':'Aún no hay comidas registradas esta semana.')+'</p></div>'}
function viewFood(){
  const T=dayTotals(S.fday),G=targets(S.fday),left=G.k-T.k,fd=S.food.days[S.fday]||{entries:[]},gym=isGym(S.fday),es0=fd.entries||[];
  let h='<div class="fbar"><button type="button" class="sq" data-fprev="1" aria-label="Día anterior">‹</button><div class="dl">'+esc(dayLabel(S.fday))+'</div><button type="button" class="sq" data-fnext="1" aria-label="Día siguiente">›</button></div>'+

  '<div class="card"><div class="kc"><div><small>Consumidas</small><b>'+r0(T.k)+'</b></div><div><small>Objetivo</small><b>'+r0(G.k)+'</b></div><div><small>'+(left>=0?'Quedan':'Te pasas')+'</small><b class="'+(left>=0?'':'over')+'">'+r0(Math.abs(left))+'</b></div></div>'+

  mrow('Proteína',T.p,G.p,'g')+mrow('Carbohidratos',T.c,G.c,'g')+mrow('Grasa',T.f,G.f,'g')+'</div>';

  MEALS.forEach(m=>{const k=m[0],es=es0.filter(e=>e.m===k);let sub=0;es.forEach(e=>{sub+=mac(e).k});
    h+='<div class="meal"><div class="mhd"><b>'+m[1]+'</b><span>'+(es.length?r0(sub)+' kcal':'')+'</span><button type="button" class="pl" data-fadd="'+k+'" aria-label="Añadir a '+m[1]+'">+</button></div>'+
    es.map(e=>{const x=mac(e);return '<button type="button" class="fe" data-fe="'+e.id+'"><span class="fn">'+esc(e.name)+'<small>'+qtyText(e)+' · P '+r0(x.p)+' · C '+r0(x.c)+' · G '+r0(x.f)+'</small></span><span class="fk">'+r0(x.k)+'</span></button>'}).join('')+
    (es.length>=2?'<div class="empty"><button type="button" class="lnk" data-fsave="'+k+'">Guardar como comida</button></div>':'')+'</div>'});
  return h+weekCard()}

/* mantenimiento estimado a partir de peso y comida */
function tdeeCard(){
  const ws=[];for(let i=1;i<=WEEKS;i++){const b=S.body[bid(i)];if(b&&num(b.kg)&&b.date)ws.push({date:b.date,kg:num(b.kg)})}
  ws.sort((a,b)=>a.date<b.date?-1:1);
  const head='<div class="card"><h3>Mantenimiento estimado</h3>';
  if(ws.length<2)return head+'<p class="muted">Se calcula con tus pesajes (pestaña Cuerpo) y lo que registres en Comida. Hacen falta al menos dos pesajes separados por una semana o más.</p></div>';
  const a=ws[Math.max(0,ws.length-3)],b=ws[ws.length-1];
  const n=Math.round((new Date(b.date+'T12:00:00')-new Date(a.date+'T12:00:00'))/864e5);
  let sum=0,logged=0;for(let i=1;i<=n;i++){const t=dayTotals(addDays(a.date,i));if(t.k>0){sum+=t.k;logged++}}
  if(n<5||logged<Math.max(4,Math.ceil(n*.6)))return head+'<p class="muted">Entre el '+a.date+' y el '+b.date+' ('+n+' días) tienes '+logged+' días con comida registrada. Con al menos el 60 % de los días registrados puedo estimarlo.</p></div>';
  const avg=sum/logged,d=b.kg-a.kg,est=avg-d*7700/n;
  return head+'<div class="kc"><div><small>Comías de media</small><b>'+r0(avg)+'</b></div><div><small>Peso</small><b>'+(d>0?'+':'')+fmt(Math.round(d*10)/10)+'</b></div><div><small>Mantenimiento</small><b>'+r0(est)+'</b></div></div><p class="muted">Entre el '+a.date+' y el '+b.date+' ('+n+' días, '+logged+' registrados). Es una estimación: el agua mueve el peso uno o dos kilos, así que fíate más cuando haya varias semanas de datos.</p></div>'}

/* hoja de añadir alimento */
const SH={open:false,meal:'bf',tab:'rec',food:null,edit:null,q:'',cur:[],qv:100,form:null};
const sheetEl=()=>document.getElementById('sheet');
function foodRow(f,i,extra){return '<div class="fi"><button type="button" class="fim" data-fpick="'+i+'"><span class="fn">'+esc(f.name)+'<small>'+(f.brand?esc(f.brand)+' · ':'')+(f.t==='g'?'por 100 g':'por ración')+' · P '+r1(f.p)+' · C '+r1(f.c)+' · G '+r1(f.f)+'</small></span><span class="fk">'+r0(f.k)+'</span></button>'+(extra||'')+'</div>'}
function recents(){const seen={},out=[];const dates=Object.keys(S.food.days).sort().reverse();
  for(const d of dates){const es=S.food.days[d].entries||[];for(let i=es.length-1;i>=0;i--){const e=es[i],key=e.name+'|'+e.t+'|'+e.k;if(seen[key])continue;seen[key]=1;out.push({name:e.name,brand:e.brand||'',t:e.t,k:e.k,p:e.p,c:e.c,f:e.f,serv:e.serv||null,lastQ:e.q});if(out.length>=30)return out}}
  return out}
function openSheet(meal){SH.open=true;SH.meal=meal;SH.tab='rec';SH.food=null;SH.edit=null;SH.q='';SH.cur=[];SH.form=null;drawSheet()}
function closeSheet(){SH.open=false;SH.food=null;SH.edit=null;drawSheet()}
function mealName(){return(MEALS.find(m=>m[0]===SH.meal)||['',''])[1]}
function qtyHtml(){
  const f=SH.food,g=f.t==='g',chips=g?[50,100,150,200].concat(f.serv?[f.serv]:[]):[.5,1,1.5,2];
  return '<div class="shh"><b>'+esc(f.name)+'</b><button type="button" class="lnk" data-sback="1">'+(SH.edit?'Cerrar':'Atrás')+'</button></div>'+(f.brand?'<div class="muted">'+esc(f.brand)+'</div>':'')+
  '<div class="muted">'+(g?'Por 100 g':'Por ración')+': '+r0(f.k)+' kcal · P '+r1(f.p)+' · C '+r1(f.c)+' · G '+r1(f.f)+'</div>'+
  '<div class="fld"><label for="fq_q">'+(g?'Cantidad (g)':'Raciones')+'</label><input class="f" id="fq_q" type="text" inputmode="decimal" autocomplete="off" value="'+fmt(SH.qv)+'"></div>'+
  '<div class="chips">'+chips.map(c=>'<button type="button" class="chip" data-fchip="'+c+'">'+(g?fmt(c)+' g':'× '+fmt(c))+'</button>').join('')+'</div>'+
  '<div class="prev2" id="fprev"></div>'+
  '<button type="button" class="fin" data-fok="1">'+(SH.edit?'Guardar cambios':'Añadir a '+esc(mealName()))+'</button>'+
  (SH.edit?'<button type="button" class="btn danger" data-fdel="1">Eliminar de este día</button>':(f.id?'':'<button type="button" class="btn" data-fsavelib="1">Guardar en Mis alimentos</button>'))}
function formHtml(){
  const f=SH.form||{name:'',t:'g',k:'',p:'',c:'',f:''},isNew=!f.id;
  const inp=(id,l,v)=>'<div class="fld"><label for="'+id+'">'+l+'</label><input class="f" id="'+id+'" type="text" inputmode="decimal" autocomplete="off" value="'+esc(v===''||v==null?'':fmt(v))+'"></div>';
  return '<div class="shh"><b>'+(isNew?'Nuevo alimento':'Editar alimento')+'</b><button type="button" class="lnk" data-stab="mine">Atrás</button></div>'+
  '<div class="fld"><label for="n_name">Nombre</label><input class="f sin" id="n_name" type="text" autocomplete="off" value="'+esc(f.name)+'"></div>'+
  '<div class="fld"><label for="n_t">Los valores son</label><select class="sel" id="n_t"><option value="g"'+(f.t==='g'?' selected':'')+'>Por 100 g</option><option value="u"'+(f.t==='u'?' selected':'')+'>Por ración (bocadillo, huevo, plato…)</option></select></div>'+
  '<div class="grid2">'+inp('n_k','Calorías',f.k)+inp('n_p','Proteína (g)',f.p)+inp('n_c','Carbohidratos (g)',f.c)+inp('n_f','Grasa (g)',f.f)+'</div>'+
  '<button type="button" class="fin" data-fform="1">Guardar</button>'+(isNew?'':'<button type="button" class="btn danger" data-fformdel="1">Eliminar</button>')}
function drawSheet(){
  const el=sheetEl();
  if(!SH.open){el.innerHTML='';document.body.style.overflow='';return}
  document.body.style.overflow='hidden';
  let h='<button type="button" class="sh-bg" data-sclose="1" aria-label="Cerrar"></button><div class="sh" role="dialog" aria-label="Añadir alimento">';
  if(SH.food){h+=qtyHtml()}
  else if(SH.tab==='form'){h+=formHtml()}
  else if(SH.tab==='saveblock'){h+='<div class="shh"><b>Guardar como comida</b><button type="button" class="lnk" data-sclose="1">Cerrar</button></div><p class="muted">Se guardan juntas las comidas de '+esc(mealName())+' de este día como una sola ración, para añadirlas de golpe otro día.</p><div class="fld"><label for="sb_name">Nombre</label><input class="f sin" id="sb_name" type="text" autocomplete="off" placeholder="Ej. Desayuno de avena"></div><button type="button" class="fin" data-fsaveok="1">Guardar</button>'}
  else{
    h+='<div class="shh"><b>'+esc(mealName())+'</b><button type="button" class="lnk" data-sclose="1">Cerrar</button></div><div class="tabs">'+[['rec','Recientes'],['mine','Míos'],['search','Buscar'],['quick','Rápido']].map(t=>'<button type="button" class="tb'+(SH.tab===t[0]?' on':'')+'" data-stab="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>';
    if(SH.tab==='rec'){SH.cur=recents();h+=SH.cur.length?'<div>'+SH.cur.map((f,i)=>foodRow(f,i)).join('')+'</div>':'<p class="muted">Aún no hay alimentos recientes. Usa Míos, Buscar o Rápido.</p>'}
    else if(SH.tab==='mine'){SH.cur=S.food.lib;h+='<button type="button" class="btn" data-fnew="1">+ Nuevo alimento</button><div>'+SH.cur.map((f,i)=>foodRow(f,i,'<button type="button" class="ed" data-fedit="'+i+'" aria-label="Editar">✎</button>')).join('')+'</div>'}
    else if(SH.tab==='search'){h+='<input class="f sin" id="fq" type="search" enterkeyhint="search" autocomplete="off" placeholder="Producto o código de barras" value="'+esc(SH.q)+'"><div id="fres"><p class="muted">Busca productos de supermercado en Open Food Facts. Escribe al menos 2 letras o un código de barras.</p></div>'}
    else{h+='<div class="fld"><label for="q_n">Nombre (opcional)</label><input class="f sin" id="q_n" type="text" autocomplete="off" placeholder="Ej. Bocadillo del bar"></div><div class="grid2"><div class="fld"><label for="q_k">Calorías</label><input class="f" id="q_k" type="text" inputmode="decimal" autocomplete="off"></div><div class="fld"><label for="q_p">Proteína (g)</label><input class="f" id="q_p" type="text" inputmode="decimal" autocomplete="off"></div><div class="fld"><label for="q_c">Carbohidratos (g)</label><input class="f" id="q_c" type="text" inputmode="decimal" autocomplete="off"></div><div class="fld"><label for="q_f">Grasa (g)</label><input class="f" id="q_f" type="text" inputmode="decimal" autocomplete="off"></div></div><button type="button" class="fin" data-fquick="1">Añadir a '+esc(mealName())+'</button>'}}
  el.innerHTML=h+'</div>';
  if(SH.food)updatePrev();
  if(!SH.food&&SH.tab==='search'){const q=$('#fq');if(q){if(SH.q)doSearch(SH.q);else setTimeout(()=>q.focus(),60)}}}
function updatePrev(){const el=$('#fprev'),q=num(($('#fq_q')||{}).value);if(!el)return;if(!(q>0)){el.textContent='';return}const m=mac(Object.assign({},SH.food,{q}));el.textContent='= '+r0(m.k)+' kcal · P '+r0(m.p)+' · C '+r0(m.c)+' · G '+r0(m.f)}
function pickFood(f){SH.food=f;SH.edit=null;SH.qv=f.lastQ!=null?f.lastQ:(f.t==='g'?(f.serv||100):1);drawSheet()}
function addEntry(){
  const f=SH.food,q=num($('#fq_q').value);if(!(q>0)){toast('Pon una cantidad');return}
  const fd=FD();
  if(SH.edit){const en=fd.entries.find(x=>x.id===SH.edit);if(en)en.q=q}
  else fd.entries.push({id:uid(),m:SH.meal,name:f.name,brand:f.brand||'',t:f.t,k:f.k,p:f.p,c:f.c,f:f.f,serv:f.serv||null,q,ts:Date.now()});
  save();const edited=!!SH.edit;closeSheet();render(true);toast(edited?'Guardado':'Añadido')}
let sAbort=null,sTimer=null;
function offToFood(p){const n=p.nutriments||{};let k=n['energy-kcal_100g'];if(k==null&&n.energy_100g!=null)k=n.energy_100g/4.184;if(k==null||!isFinite(+k))return null;const name=String(p.product_name_es||p.product_name||'').trim();if(!name)return null;
  return{name,brand:String(p.brands||'').split(',')[0].trim(),t:'g',k:+k,p:+(n.proteins_100g||0),c:+(n.carbohydrates_100g||0),f:+(n.fat_100g||0),serv:p.serving_quantity?+p.serving_quantity:null}}
function doSearch(q){
  q=(q||'').trim();clearTimeout(sTimer);if(sAbort){sAbort.abort();sAbort=null}
  const box=$('#fres');if(!box)return;
  if(q.length<2){SH.cur=[];box.innerHTML='<p class="muted">Escribe al menos 2 letras o un código de barras.</p>';return}
  box.innerHTML='<p class="muted">Buscando…</p>';
  sTimer=setTimeout(async()=>{
    const ac=sAbort=new AbortController();
    try{
      let items=[];const fields='product_name,product_name_es,brands,nutriments,serving_quantity';
      if(/^\d{8,14}$/.test(q)){const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+q+'.json?fields='+fields,{signal:ac.signal});const j=await r.json();if(j&&j.product)items=[j.product]}
      else{const r=await fetch('https://world.openfoodfacts.org/cgi/search.pl?search_simple=1&action=process&json=1&page_size=24&cc=es&lc=es&fields='+fields+'&search_terms='+encodeURIComponent(q),{signal:ac.signal});const j=await r.json();items=j.products||[]}
      const b2=$('#fres');if(!b2)return;
      SH.cur=items.map(offToFood).filter(Boolean);
      b2.innerHTML=SH.cur.length?SH.cur.map((f,i)=>foodRow(f,i)).join(''):'<p class="muted">Sin resultados. Prueba otra palabra, o crea el alimento en Míos o Rápido.</p>'
    }catch(e){if(e&&e.name==='AbortError')return;const b2=$('#fres');if(b2)b2.innerHTML='<p class="muted">No se pudo buscar. Comprueba la cobertura, o usa Míos y Rápido.</p>'}
  },700)}
function readForm(){const g=id=>(document.getElementById(id)||{}).value;return{name:String(g('n_name')||'').trim(),t:g('n_t')==='u'?'u':'g',k:num(g('n_k')),p:num(g('n_p'))||0,c:num(g('n_c'))||0,f:num(g('n_f'))||0}}

document.addEventListener('click',ev=>{
  const t=ev.target.closest('button');if(!t)return;const D=t.dataset;
  if(D.fprev){S.fday=addDays(S.fday,-1);render()}
  else if(D.fnext){S.fday=addDays(S.fday,1);render()}
  else if(D.ftoday){S.fday=todayISO();render()}
  else if(D.fgym){const d=FD();d.gym=!isGym(S.fday);save();render(true)}
  else if(D.fcopy){const y=S.food.days[addDays(S.fday,-1)];if(y&&y.entries){const d=FD();y.entries.forEach(e=>d.entries.push(Object.assign({},e,{id:uid(),ts:Date.now()})));save();render(true);toast('Copiado')}}
  else if(D.fadd){openSheet(D.fadd)}
  else if(D.fe){const en=((S.food.days[S.fday]||{}).entries||[]).find(x=>x.id===D.fe);if(en){SH.open=true;SH.meal=en.m;SH.edit=en.id;SH.food={name:en.name,brand:en.brand,t:en.t,k:en.k,p:en.p,c:en.c,f:en.f,serv:en.serv,id:'x'};SH.qv=en.q;drawSheet()}}
  else if(D.fsave){SH.open=true;SH.meal=D.fsave;SH.tab='saveblock';SH.food=null;drawSheet()}
  else if(D.fsaveok){const nm=($('#sb_name')||{}).value;if(!nm||!nm.trim()){toast('Ponle un nombre');return}
    const s={k:0,p:0,c:0,f:0};((S.food.days[S.fday]||{}).entries||[]).filter(e=>e.m===SH.meal).forEach(e=>{const m=mac(e);s.k+=m.k;s.p+=m.p;s.c+=m.c;s.f+=m.f});
    S.food.lib.push({id:uid(),name:nm.trim(),t:'u',k:Math.round(s.k),p:Math.round(s.p*10)/10,c:Math.round(s.c*10)/10,f:Math.round(s.f*10)/10});save();closeSheet();toast('Guardado en Míos')}
  else if(D.sclose){closeSheet()}
  else if(D.sback){if(SH.edit)closeSheet();else{SH.food=null;drawSheet()}}
  else if(D.stab){SH.tab=D.stab;SH.food=null;SH.form=null;drawSheet()}
  else if(D.fpick!==undefined){const f=SH.cur[+D.fpick];if(f)pickFood(f)}
  else if(D.fchip){const i=$('#fq_q');if(i){i.value=fmt(+D.fchip);updatePrev()}}
  else if(D.fok){addEntry()}
  else if(D.fdel){const d=FD();d.entries=d.entries.filter(x=>x.id!==SH.edit);save();closeSheet();render(true);toast('Eliminado')}
  else if(D.fsavelib){const f=SH.food;S.food.lib.push({id:uid(),name:f.name,brand:f.brand||'',t:f.t,k:Math.round(f.k*10)/10,p:f.p,c:f.c,f:f.f,serv:f.serv||null});f.id='x';save();toast('Guardado en Míos');drawSheet()}
  else if(D.fnew){SH.tab='form';SH.form=null;drawSheet()}
  else if(D.fedit!==undefined){SH.tab='form';SH.form=Object.assign({},S.food.lib[+D.fedit]);drawSheet()}
  else if(D.fform){const v=readForm();if(!v.name||v.k==null){toast('Falta el nombre o las calorías');return}
    if(SH.form&&SH.form.id){const i=S.food.lib.findIndex(x=>x.id===SH.form.id);if(i>=0)S.food.lib[i]=Object.assign({},S.food.lib[i],v)}else S.food.lib.push(Object.assign({id:uid()},v));
    save();SH.tab='mine';SH.form=null;drawSheet();toast('Guardado')}
  else if(D.fformdel){if(SH.form&&SH.form.id){S.food.lib=S.food.lib.filter(x=>x.id!==SH.form.id);save();SH.tab='mine';SH.form=null;drawSheet();toast('Eliminado')}}
  else if(D.fquick){const g=id=>num(($('#'+id)||{}).value),k=g('q_k');if(k==null){toast('Pon las calorías');return}
    FD().entries.push({id:uid(),m:SH.meal,name:(($('#q_n')||{}).value||'').trim()||'Comida rápida',brand:'',t:'u',k,p:g('q_p')||0,c:g('q_c')||0,f:g('q_f')||0,serv:null,q:1,ts:Date.now()});
    save();closeSheet();render(true);toast('Añadido')}});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.dataset.tgt){const v=num(t.value);if(v!=null&&v>=0){S.food.tg[t.dataset.tgt]=v;save()}}
  else if(t.id==='fq_q')updatePrev();
  else if(t.id==='fq'){SH.q=t.value;doSearch(t.value)}});

/* ---------- inicio ---------- */
foodInit();render();wake();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
})();
</script>
